
name: WorkflowOS CI and CD

on:
  push:
    branches:
      - main
      - DEV
      - TEST
      - LIVE

  pull_request:
    branches:
      - main
      - DEV
      - TEST
      - LIVE

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflowos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================
  # 1. CONTINUOUS INTEGRATION
  # Runs on all branches
  # ==========================================

  verify:
    name: Verify WorkflowOS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check


  # ==========================================
  # 2. BUILD FRONTEND
  # MAIN ONLY
  # ==========================================

  build-pages:
    name: Build WorkflowOS frontend
    needs: verify

    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build frontend
        run: npm run build:pages

      - name: Verify build output
        run: |
          if [ ! -f "pages/index.html" ]; then
            echo "ERROR: pages/index.html is missing."
            exit 1
          fi

      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages/


  # ==========================================
  # 3. DEPLOY GITHUB PAGES
  # MAIN ONLY
  # ==========================================

  deploy-pages:
    name: Deploy WorkflowOS frontend
    needs: build-pages

    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
