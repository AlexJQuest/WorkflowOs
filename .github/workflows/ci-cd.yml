
name: CI and CD

on:
  push:
    branches: [main, DEV, TEST, LIVE]

  pull_request:
    branches: [main, DEV, TEST, LIVE]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflowos-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================
  # 1. CONTINUOUS INTEGRATION
  # ==========================================

  verify:
    name: Verify (Node.js 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check

      - name: Apply database migrations
        run: npm run db:migrate
        env:
          DATABASE_PATH: ${{ runner.temp }}/workflowos-ci.db

      - name: Run integration tests
        run: npm test

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high


  # ==========================================
  # 2. BUILD FRONTEND
  # ==========================================

  build:
    name: Build WorkflowOS frontend
    needs: verify

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        run: npm run build:pages

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: workflowos-frontend
          path: pages/
          retention-days: 1


  # ==========================================
  # 3. DEPLOY TO GITHUB PAGES
  # ==========================================

  deploy-pages:
    name: Deploy WorkflowOS to GitHub Pages
    needs: build

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: workflowos-frontend
          path: ./site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


  # ==========================================
  # 4. LIVE SAAS DEPLOYMENT
  # ==========================================

  deploy-saas:
    name: Deploy SaaS via HTTPS hook
    needs: verify

    if: github.event_name == 'push' && github.ref == 'refs/heads/LIVE'

    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Trigger deployment
        run: node scripts/deploy-hook.js
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
