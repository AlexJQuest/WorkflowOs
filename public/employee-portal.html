<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Employee portal | WorkflowOS</title>
    <link rel="stylesheet" href="/marketing.css" />
    <link rel="stylesheet" href="/employee-portal.css" />
  </head>
  <body class="public-body">
    <main class="public-site">
      <header class="portal-header">
        <a class="site-brand" href="/" aria-label="WorkflowOS home">
          <span class="site-brand-mark">W</span><span>workflow<span>OS</span></span>
        </a>
        <a href="/">Business home</a>
      </header>
      <section class="site-page-hero">
        <p class="site-eyebrow">EMPLOYEE PORTAL</p>
        <h1>Your payslips, in one place.</h1>
        <p>Sign in to view and download finalised payslips shared by your employer.</p>
      </section>
      <section class="portal-content" id="portal-content" aria-live="polite"></section>
      <footer class="portal-footer">
        <p>Questions about payroll figures or payment should be directed to your employer. WorkflowOS payslip calculations are estimates, not tax certificates.</p>
      </footer>
    </main>
    <script src="/employee-portal.js"></script>
  </body>
</html>
